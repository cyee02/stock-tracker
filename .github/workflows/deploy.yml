name: Test and deploy to Mac mini

on:
  push:
    branches: [main]
  workflow_dispatch:

# One deploy at a time; a newer push waits for the running one instead of
# killing it halfway through `docker compose up`.
concurrency:
  group: deploy-macmini
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Backend tests
        working-directory: backend
        run: |
          pip install -e '.[dev]'
          pytest -q

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Frontend build
        working-directory: frontend
        run: |
          npm ci
          npm run build

  deploy:
    needs: test
    # The self-hosted runner on the Mac mini, registered with the "macmini" label.
    runs-on: [self-hosted, macOS, macmini]
    steps:
      - uses: actions/checkout@v4
      - name: Build, start and wait until healthy
        run: ./deploy/deploy.sh
