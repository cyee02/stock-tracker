[project]
name = "stock-tracker"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "yfinance>=0.2.54",
  "pandas>=2.2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.setuptools]
packages = ["app", "app.routes"]

[tool.pytest.ini_options]
testpaths = ["tests"]
